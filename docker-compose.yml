
services:
  nginx:
    image: nginx:alpine
    container_name: confederation-local
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      - ./deployments/shell/current:/usr/share/nginx/html:ro

      - ./deployments/mfe-dashboard/current:/usr/share/nginx/html/mfe-dashboard:ro

    restart: unless-stopped
