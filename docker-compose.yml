
services:
  nginx:
    image: nginx:alpine
    container_name: confederation-local
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

      - ./deployments/shell/current:/srv/shell:ro

      - ./deployments/class/current:/srv/class:ro

    restart: unless-stopped
