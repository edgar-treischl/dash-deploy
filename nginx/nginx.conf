
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Confederation Shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dashboard MFE
    location /mfe-dashboard/ {
        try_files $uri $uri/ /mfe-dashboard/index.html;
    }

    # Return 404 for missing static assets
    location ~* \.(js|mjs|css|json|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
    }
}
