
server {
    listen 80;
    server_name localhost;

    root /srv/shell;
    index index.html;
    absolute_redirect off;

    # Confederation Shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Class MFE, including the base path used by its current Vite build
    location = /class {
        return 301 /class/;
    }

    location /class/ {
        root /srv;
        try_files $uri $uri/ /class/index.html;
    }

    location = /klassenwiederholung-mfe {
        return 301 /klassenwiederholung-mfe/;
    }

    location ^~ /klassenwiederholung-mfe/ {
        rewrite ^/klassenwiederholung-mfe/(.*)$ /class/$1 last;
    }

    location ~* ^/class/.*\.(js|mjs|css|json|png|jpg|svg|woff2?)$ {
        root /srv;
        try_files $uri =404;
    }

    # Return 404 for missing static assets
    location ~* \.(js|mjs|css|json|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
    }
}
