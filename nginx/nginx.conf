
server {
    listen 80;
    server_name localhost;

    root /srv/shell;
    index index.html;
    absolute_redirect off;

    # Confederation Shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirect direct /class access to Shell login (MFEs only accessible through Shell)
    location = /class {
        return 301 /;
    }

    location /class/ {
        # Redirect direct access to login page; Shell will load MFE internally
        return 302 /?login_required=class;
    }

    # Internal path for Module Federation remoteEntry (accessed by Shell only)
    location = /klassenwiederholung-mfe {
        return 301 /klassenwiederholung-mfe/;
    }

    location ^~ /klassenwiederholung-mfe/ {
        # Add CORS headers for Module Federation remoteEntry
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        root /srv;
        rewrite ^/klassenwiederholung-mfe/(.*)$ /class/$1 break;
        try_files $uri =404;
    }

    # Static assets for MFEs - allow access only for files, not navigation
    location ~* ^/class/.*\.(js|mjs|css|json|png|jpg|svg|woff2?)$ {
        root /srv;
        try_files $uri =404;
    }

    # Return 404 for missing static assets
    location ~* \.(js|mjs|css|json|png|jpg|svg|woff2?)$ {
        try_files $uri =404;
    }
}
